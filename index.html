<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMS Portal | Inventory Management System</title>
    <!-- CSS FILE -->
    <link rel="stylesheet" href="./style.css">
    <style>
        .demo-login-box {
            margin-top: 25px;
            padding: 16px 28px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: inline-block;
            max-width: 480px;
            text-align: center;
        }
        .demo-btn {
            background: #06b6d4;
            color: #ffffff;
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 10px;
        }
        .demo-btn:hover {
            background: #0891b2;
            transform: scale(1.04);
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 40px 20px;
            text-align: center;
            margin-top: 60px;
        }
    </style>
</head>

<body>

    <nav>
        <h1>IMS Portal</h1>

        <div class="nav-buttons">
            <button class="signup" onclick="openModal('signup')">
                ✚ Sign Up
            </button>

            <button class="login" onclick="openModal('login')">
                ➜ Login
            </button>
        </div>
    </nav>

    <main class="hero">
        <h2>
            <span class="hero-icon">📦</span>
            Smart Inventory Management
        </h2>

        <p>Manage your stock, sales & purchases with ease 🚀</p>

        <div class="demo-login-box">
            <p style="color: #ffffff; font-size: 0.95rem; line-height: 1.5; margin-bottom: 8px;">
                <strong>Default System Credentials:</strong><br>
                Email: <code>admin@ims.com</code> &bull; Password: <code>admin123</code>
            </p>
            <button class="demo-btn" onclick="quickAdminLogin()">⚡ 1-Click Instant Login</button>
        </div>
    </main>

    <!-- SIGNUP MODAL -->
    <div class="modal" id="signup">
        <div class="modal-box">
            <h3>Create Account</h3>
            <p class="error" id="signupError"></p>
            <p class="success" id="signupSuccess"></p>

            <form id="signupForm">
                <input type="text" id="signupName" placeholder="Full Name" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="tel" id="signupPhone" placeholder="Phone Number">
                <input type="password" id="signupPassword" placeholder="Password" required minlength="6">
                <input type="password" id="signupCPassword" placeholder="Confirm Password" required>

                <label class="show-pass">
                    <input type="checkbox" onchange="togglePassword('signupPassword','signupCPassword')">
                    Show Password
                </label>

                <button type="submit">Create Account</button>
            </form>

            <button class="close" onclick="closeModal('signup')">Close</button>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div class="modal" id="login">
        <div class="modal-box">
            <h3>Login to IMS</h3>
            <p class="error" id="loginError"></p>
            <p class="success" id="loginSuccess"></p>

            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email (admin@ims.com)" required>
                <input type="password" id="loginPassword" placeholder="Password (admin123)" required>

                <label class="show-pass">
                    <input type="checkbox" onchange="togglePassword('loginPassword')">
                    Show Password
                </label>

                <button type="submit">Login</button>
            </form>

            <button class="close" onclick="closeModal('login')">Close</button>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="./app.js"></script>
    <script>
        function quickAdminLogin() {
            const adminUser = {
                name: "System Administrator",
                email: "admin@ims.com",
                phone: "9800000000",
                password: "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9",
                createdAt: new Date().toISOString()
            };
            const session = {
                name: adminUser.name,
                email: adminUser.email,
                loginTime: new Date().toISOString()
            };
            localStorage.setItem("ims_single_user", JSON.stringify(adminUser));
            localStorage.setItem("ims_current_user", JSON.stringify(session));
            window.location.replace("./dashboard.html");
        }
    </script>

</body>
</html>
